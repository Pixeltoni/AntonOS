name: iOS-App zu TestFlight hochladen

# Baut AntonOS als iOS-App auf einem Mac von GitHub und lädt sie zu TestFlight hoch.
# Enthält die Widget-Erweiterung (ios/App/AntonOSWidgets, Bundle-ID io.github.pixeltoni.antonos.widgets)
# mit der App Group group.io.github.pixeltoni.antonos – beides legt die automatische Signierung an.
# Start von Hand: GitHub → Actions → „iOS-App zu TestFlight hochladen“ → Run workflow.
# Nötige Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       – Team-ID aus developer.apple.com → Membership
#   ASC_KEY_ID          – Schlüssel-ID des App-Store-Connect-API-Schlüssels
#   ASC_ISSUER_ID       – Issuer-ID von derselben Seite
#   ASC_KEY_P8          – kompletter Inhalt der heruntergeladenen .p8-Datei
#   TOENE_SCHLUESSEL    – Passwort für ios/eigene-toene.tar.gz.enc (eigene Lieder als Wecktöne; ohne: Standardton)
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Secrets prüfen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Diese Secrets fehlen oder sind leer:$missing – eintragen unter Settings → Secrets and variables → Actions → Reiter „Secrets“ → „New repository secret“ (nicht bei „Variables“ und nicht als Environment-Secret)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Apple nimmt nur Apps an, die mit dem iOS-26-SDK (Xcode 26 oder neuer) gebaut sind
      - name: Neuestes Xcode wählen
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::Kein Xcode 26 auf dem Runner gefunden"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Eigene Lieder sind urheberrechtlich geschützt und liegen daher nur verschlüsselt im öffentlichen Repo.
      # Sie kommen ins App-Paket (Weckton am gesperrten iPhone) und nach public/tones (Vorhören in der App).
      - name: Eigene Lieder entpacken
        env:
          TOENE_SCHLUESSEL: ${{ secrets.TOENE_SCHLUESSEL }}
        run: |
          tones=ios/App/App/Tones
          mkdir -p public/tones
          ssl="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$ssl" ] || ssl=openssl
          if [ -n "$TOENE_SCHLUESSEL" ]; then
            "$ssl" enc -d -aes-256-cbc -pbkdf2 -pass env:TOENE_SCHLUESSEL -in ios/eigene-toene.tar.gz.enc | tar -xzf - -C "$tones"
          else
            echo "::warning::Secret TOENE_SCHLUESSEL fehlt – eigene Lieder klingen wie der Standardton."
          fi
          # Jedes im Xcode-Projekt eingetragene Lied muss existieren, sonst schlägt der Build fehl
          for f in $(grep -o 'path = Tones/antonos-lied-[^;]*' ios/App/App.xcodeproj/project.pbxproj | sed 's|path = Tones/||' | sort -u); do
            [ -f "$tones/$f" ] || { echo "::warning::$f fehlt – nehme den Standardton"; cp "$tones/antonos-aufgang.wav" "$tones/$f"; }
            cp "$tones/$f" public/tones/
          done
          ls -la "$tones" public/tones

      - run: npm run build
      - run: npx cap sync ios

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Ohne Signatur archivieren: Eine Entwickler-Signatur bräuchte ein registriertes iPhone.
      # Signiert wird erst beim Export – mit Verteilungs-Zertifikat und App-Store-Profil, ganz ohne Gerät.
      - name: Archiv bauen
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      # Ohne Signatur fehlen im Archiv die Berechtigungen (App Group für die Widgets).
      # Vorläufig ohne Zertifikat signieren, damit der Export sie übernimmt und richtig signiert.
      # Ablenkungs-Sperre: braucht die Berechtigung „Family Controls (Distribution)“ von Apple für die App und die
      # Erweiterungen SperreAnsicht, SperreKnopf und SperreWaechter. Erst wenn die Variable BILDSCHIRMZEIT = an ist
      # (Settings → Secrets and variables → Actions → Variables), kommen sie in den Build – sonst bleibt alles wie bisher.
      - name: Berechtigungen eintragen
        env:
          BILDSCHIRMZEIT: ${{ vars.BILDSCHIRMZEIT }}
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          ents="$RUNNER_TEMP/ents"
          mkdir -p "$ents"
          cp ios/App/App/App.entitlements "$ents/App.entitlements"
          if [ "$BILDSCHIRMZEIT" = "an" ]; then
            echo "Ablenkungs-Sperre: mit Family Controls"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.family-controls bool true" "$ents/App.entitlements"
            /usr/libexec/PlistBuddy -c "Add :AntonSperre bool true" "$app/Info.plist"
          else
            echo "::notice::Ablenkungs-Sperre ohne Freigabe von Apple – Erweiterungen bleiben draußen (Variable BILDSCHIRMZEIT = an schaltet sie ein)."
            rm -rf "$app"/PlugIns/Sperre*.appex
          fi
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \;
          fi
          for ext in "$app"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            name=$(basename "$ext" .appex)
            file="ios/App/$name/$name.entitlements"
            [ -f "$file" ] || file=ios/App/AntonOSWidgets/AntonOSWidgets.entitlements
            codesign --force --sign - --timestamp=none --entitlements "$file" "$ext"
            codesign -d --entitlements - "$ext"
          done
          codesign --force --sign - --timestamp=none --entitlements "$ents/App.entitlements" "$app"
          codesign -d --entitlements - "$app"

      - name: Zu TestFlight hochladen
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
