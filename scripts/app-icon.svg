<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- App-Symbol von Daywerk: Haken im Kreis auf warmem Verlauf. Volle Fläche ohne Rundung (iOS rundet selbst). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset=".55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff3d5a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="512" cy="512" r="250"/>
    <polyline points="402,518 482,598 632,438"/>
  </g>
</svg>
